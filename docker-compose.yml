# The whole stack boots with an empty .env in PROVIDER_MODE=mock.
name: sal-verifier

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  # Optional: the stack is designed to boot with no secrets at all, so a missing
  # .env must not break compose. Without `required: false` every compose command
  # fails on a fresh clone, which is exactly the one-shot-setup promise broken.
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://verifier:verifier@postgres:5432/verifier
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: verifier
      POSTGRES_PASSWORD: verifier
      POSTGRES_DB: verifier
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifier"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    environment:
      ROLE: migrate
      DATABASE_URL: postgresql+psycopg://verifier:verifier@postgres:5432/verifier
    restart: "no"

  api:
    <<: *app
    # Chromium here, not only in browserworker. Browser fetches run INLINE in the
    # orchestrator's asyncio.gather rather than on QUEUE_BROWSER (todo.md bug 14), so
    # they execute in whichever process runs the pipeline -- api (inline dispatch) or
    # worker. browserworker never sees one (todo.md bug 15). Costs ~400MB per image;
    # the alternative is every SSO citation raising "Playwright is not installed in
    # this image", which is a WARN and safe, but silently useless.
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: {INSTALL_BROWSER: "true"}
    environment:
      ROLE: api
      DATABASE_URL: postgresql+psycopg://verifier:verifier@postgres:5432/verifier
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: {INSTALL_BROWSER: "true"}
    environment:
      ROLE: worker
      DATABASE_URL: postgresql+psycopg://verifier:verifier@postgres:5432/verifier
      REDIS_URL: redis://redis:6379/0

  judgeworker:
    <<: *app
    environment:
      ROLE: judgeworker
      DATABASE_URL: postgresql+psycopg://verifier:verifier@postgres:5432/verifier
      REDIS_URL: redis://redis:6379/0

  # CURRENTLY UNREACHABLE. Nothing dispatches to QUEUE_BROWSER -- the whole pipeline runs
  # inside run_verification on the default queue via asyncio.gather -- so this service
  # starts, connects and waits forever. Kept rather than deleted because it is the shape
  # of the fix for todo.md bug 14, not because it is doing anything today.
  browserworker:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: {INSTALL_BROWSER: "true"}
    environment:
      ROLE: browserworker
      DATABASE_URL: postgresql+psycopg://verifier:verifier@postgres:5432/verifier
      REDIS_URL: redis://redis:6379/0
      BROWSER_PROFILE_DIR: /profile
    volumes: [browserprofile:/profile]
    profiles: [browser]

volumes:
  pgdata:
  redisdata:
  browserprofile:
